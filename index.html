  <style>
    /* ==========================================
       CSS VARIABLES & BASE STYLES
       ========================================== */
    :root {
      --bg-black: #101114;
      --bg-card: #181A1F;
      --text-white: #F7F7F5;
      --electric-blue: #2457D6;
      --electric-blue-hover: #1b44ab;
      --bright-red: #E44747;
      --light-blue: #DCE5FF;
      --soft-grey: #E8E8E8;
      --text-muted: #A0A5B1;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: var(--font-body);
      line-height: 1.6;
      overflow-x: hidden;
      padding-bottom: 70px;
    }

    body.no-scroll {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      cursor: pointer;
      font-family: inherit;
      border: none;
      outline: none;
    }

    /* ==========================================
       1. AUTOMATIC WELCOME POPUP WITH COUNTDOWN
       ========================================== */
    #welcome-popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(16, 17, 20, 0.98);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 1;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      visibility: visible;
      padding: 20px;
    }

    #welcome-popup.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .popup-content {
      background: linear-gradient(145deg, #181a1f, #121317);
      border: 1px solid var(--electric-blue);
      box-shadow: 0 0 35px rgba(36, 87, 214, 0.35);
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 500px;
      width: 100%;
      animation: popupScale 0.6s ease-out forwards;
      position: relative;
    }

    @keyframes popupScale {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .popup-subheading {
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .popup-logo {
      font-family: var(--font-heading);
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .popup-logo span {
      color: var(--electric-blue);
    }

    .popup-tagline {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--light-blue);
      margin-bottom: 15px;
      letter-spacing: 1.5px;
    }

    .popup-founder-badge {
      display: inline-block;
      background-color: var(--electric-blue);
      color: var(--text-white);
      padding: 6px 18px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(36, 87, 214, 0.4);
    }

    .popup-boys-badge {
      display: inline-block;
      background-color: rgba(228, 71, 71, 0.15);
      border: 1.5px solid var(--bright-red);
      color: var(--bright-red);
      padding: 8px 18px;
      border-radius: 8px;
      font-family: var(--font-heading);
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 25px;
    }

    .countdown-container {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

      font-size: 1.3
